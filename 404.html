<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — ArchiveFever.Work</title>
  <meta name="description" content="Cette page n’existe pas ou a été déplacée. Retournez à l’accueil d’ArchiveFever.Work." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" href="/IMG/Jerome.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="/IMG/Jerome.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--txt);
      font-family: "Source Code Pro", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    .card-wrap { width: min(520px, 100%); }


    .card-body { padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }

    .text-block { display: flex; flex-direction: column; gap: 8px; text-align: center; }

    .error-code {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.02em;
      line-height: 1;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--txt);
      font-weight: 700;
    }

    .section-msg {
      font-size: 13px;
      color: var(--txt2);
      line-height: 1.7;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--txt);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      transition: border-color .15s, color .15s;
    }
    .back-link:hover { border-color: var(--accent); color: var(--accent); }
    .back-link:focus-visible,
    .lang button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 400px) {
      .card-top { flex-wrap: wrap; }
      .card-body { padding: 20px 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-wrap { animation: none; }
    }
  </style>
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body class="error-page">

<main class="page">
  <article class="card-wrap" aria-labelledby="errorTitle">

    <div class="card-top">
      <a class="site-name" href="/index.html" style="text-decoration:none">Archive<span>Fever</span>.Work</a>
      <div class="lang" role="group" aria-label="Choisir la langue">
        <button id="btnFR" type="button" aria-pressed="true">FR</button>
        <button id="btnEN" type="button" aria-pressed="false">EN</button>
      </div>
    </div>

    <div class="card-body">

      <div class="text-block">
        <h1 class="error-code" id="errorTitle">404</h1>
        <div class="section-title" id="pageTitle">Page introuvable</div>
        <div class="section-msg" id="pageMsg">Cette page n'existe pas ou n'existe plus. Il n'y a rien ici.</div>
      </div>

      <a class="back-link" href="/index.html" id="backLink">Retour</a>

    </div>
  </article>
</main>

<script>
  const $ = id => document.getElementById(id);

  const T = {
    fr: {
      pageTitle: "Page introuvable",
      pageMsg:   "Cette page n'existe pas ou n'existe plus. Il n'y a rien ici.",
      backLink:  "Retour",
    },
    en: {
      pageTitle: "Page not found",
      pageMsg:   "This page does not exist or no longer exists. There is nothing here.",
      backLink:  "Back",
    }
  };

  let currentLang = "fr";

  function setLang(lang) {
    if (!T[lang]) lang = "fr";
    currentLang = lang;
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = lang === "fr" ? "404 — ArchiveFever.Work" : "404 — ArchiveFever.Work";
    document.querySelector(".lang").setAttribute("aria-label", lang === "fr" ? "Choisir la langue" : "Choose language");
    $("pageTitle").textContent = t.pageTitle;
    $("pageMsg").textContent   = t.pageMsg;
    $("backLink").textContent  = t.backLink;
    $("btnFR").setAttribute("aria-pressed", String(lang === "fr"));
    $("btnEN").setAttribute("aria-pressed", String(lang === "en"));
    try { localStorage.setItem("af_lang", lang); } catch(e) {}
  }

  $("btnFR").onclick = () => setLang("fr");
  $("btnEN").onclick = () => setLang("en");

  let savedLang = "fr";
  try { savedLang = localStorage.getItem("af_lang") || "fr"; } catch(e) {}
  setLang(savedLang);
</script>
</body>
</html>
