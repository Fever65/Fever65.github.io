<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon.webp" type="image/webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Special+Elite&amp;display=swap" rel="stylesheet" />
  <style>
    /* 404 — page autonome : tout est dans ce fichier, elle peut être servie à n'importe quelle adresse.
       Aucun flash lumineux : la peur passe par le noir, le son et ce que la page « sait ». */
    :root { --bg: #040404; --ink: #e6e6e6; --soft: #6b6b6b; --accent: #ff7a1a; --blood: #ff2a12; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font: 400 17px/1.6 "Special Elite", "Courier New", monospace;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Ambiance ---------- */
    #noise { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .08; pointer-events: none; image-rendering: pixelated; }
    .scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
    .scan::after { content: ""; position: absolute; left: 0; right: 0; height: 22vh; background: linear-gradient(transparent, rgba(255,42,18,.05), transparent); animation: roll 7s linear infinite; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.95) 100%); transition: background 8s; }
    body.close .vignette { background: radial-gradient(ellipse at center, transparent 12%, rgba(0,0,0,.98) 70%); }

    /* Le visage, une fraction de seconde */
    #ghost { position: fixed; inset: 0; margin: auto; width: min(80vmin, 620px); height: auto; opacity: 0; filter: grayscale(1) contrast(2.4) brightness(.55) invert(1); mix-blend-mode: screen; pointer-events: none; }
    #ghost.flash { animation: ghost .6s steps(3) 1; }

    /* Les yeux */
    .eyes { position: fixed; left: 50%; top: 14vh; z-index: 1; display: flex; gap: 46px; transform: translateX(-50%) scale(1); opacity: 0; pointer-events: none; transition: opacity 6s ease, transform 2.5s cubic-bezier(.6, 0, .2, 1), top 2.5s cubic-bezier(.6, 0, .2, 1); }
    .eyes.on { opacity: .85; }
    body.close .eyes { top: 7vh; transform: translateX(-50%) scale(3); opacity: .95; }
    @media (max-width: 600px) { body.close .eyes { top: 9vh; transform: translateX(-50%) scale(1.8); } }
    .eye { position: relative; width: 46px; height: 22px; border-radius: 50%; background: radial-gradient(ellipse at center, #1a1a1a, #000 70%); box-shadow: 0 0 24px rgba(255,42,18,.3); overflow: hidden; }
    .eye i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--blood); box-shadow: 0 0 10px var(--blood), 0 0 2px #fff inset; transition: transform .12s linear; }
    .eye::after { content: ""; position: absolute; inset: 0; background: var(--bg); transform: scaleY(0); transform-origin: top; }
    .eyes.blink .eye::after { animation: blink .18s ease-in-out 1; }

    /* ---------- Contenu ---------- */
    main { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
    .box { display: grid; gap: clamp(28px, 6vh, 56px); justify-items: center; max-width: 680px; }
    .code {
      position: relative; margin: .14em 0 .22em;
      font: 400 clamp(120px, 32vw, 300px)/.8 "IM Fell English", Georgia, serif; letter-spacing: -.02em;
      color: #d4d4d4;
      transform: scaleY(1.35);
      text-shadow: -2px 0 var(--blood), 2px 0 rgba(255,255,255,.25), 0 0 40px rgba(255,42,18,.3);
      animation: flicker 6s linear infinite;
    }
    .code::before, .code::after { content: attr(data-t); position: absolute; inset: 0; overflow: hidden; }
    .code::before { color: var(--blood); clip-path: inset(0 0 62% 0); transform: translateX(-6px); opacity: 0; }
    .code::after { color: var(--ink); clip-path: inset(58% 0 0 0); transform: translateX(8px); opacity: 0; }
    .code.glitch { animation: jitter .32s steps(2) 1, flicker 6s linear infinite; }
    .code.glitch::before, .code.glitch::after { opacity: 1; }
    .lines { min-height: 10em; display: grid; gap: 6px; align-content: start; font-size: clamp(15px, 2.2vw, 19px); }
    .lines p { margin: 0; color: var(--soft); }
    .lines p.hot { color: var(--ink); }
    .lines p.red { color: var(--blood); letter-spacing: .04em; text-shadow: 0 0 12px rgba(255,42,18,.5); }
    .caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -.15em; background: var(--blood); animation: caret 1s steps(1) infinite; }
    .out {
      position: relative; z-index: 4;
      display: inline-block; margin-top: 10px; padding: 12px 26px;
      border: 1px solid #2a2a2a; border-radius: 999px; background: none;
      color: var(--soft); font: inherit; font-size: 15px; letter-spacing: .04em; text-decoration: none;
      transition: color .4s, border-color .4s; cursor: none;
    }
    .out:hover, .out:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

    /* Le noir complet (coupure) et la sortie */
    .black { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: #000; opacity: 0; pointer-events: none; transition: opacity .08s; }
    .black.on { opacity: 1; }
    .black p { margin: 0; padding: 24px; color: var(--blood); font-size: clamp(18px, 3vw, 26px); letter-spacing: .08em; text-align: center; opacity: 0; transition: opacity 1.2s .3s; }
    .black.on p { opacity: 1; }

    #cursor { position: fixed; left: 0; top: 0; z-index: 9; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); opacity: 0; transition: opacity .6s; pointer-events: none; }
    .behind { position: fixed; left: 0; right: 0; bottom: 6vh; z-index: 3; text-align: center; font-size: 13px; letter-spacing: .5em; text-transform: uppercase; color: var(--blood); opacity: 0; pointer-events: none; }
    .behind.on { animation: whisper 2.6s ease-in-out 1; }

    @keyframes roll { from { top: -22vh; } to { top: 100vh; } }
    @keyframes ghost { 0% { opacity: 0; } 33% { opacity: .22; } 66% { opacity: .07; } 100% { opacity: 0; } }
    @keyframes blink { 50% { transform: scaleY(1); } }
    @keyframes flicker { 0%, 18%, 22%, 61%, 63%, 100% { opacity: 1; } 19%, 21% { opacity: .25; } 62% { opacity: .55; } 80% { opacity: .9; } }
    @keyframes jitter { 0% { transform: scaleY(1.35); } 25% { transform: translate(-6px, 2px) scaleY(1.35) skewX(8deg); } 50% { transform: translate(5px, -3px) scaleY(1.42); } 75% { transform: translate(-2px, 1px) scaleY(1.3) skewX(-5deg); } 100% { transform: scaleY(1.35); } }
    @keyframes caret { 50% { opacity: 0; } }
    @keyframes whisper { 0%, 100% { opacity: 0; } 50% { opacity: .55; } }

    @media (hover: none) { body, .out { cursor: auto; } #cursor { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #noise, #ghost { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="noise" aria-hidden="true"></canvas>
  <img id="ghost" src="/assets/favicon.webp" alt="" aria-hidden="true" />
  <div class="eyes" id="eyes" aria-hidden="true"><div class="eye"><i></i></div><div class="eye"><i></i></div></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <div class="box">
      <h1 class="code" id="code" data-t="404">404</h1>
      <div class="lines" id="lines" aria-live="polite"></div>
      <a class="out" id="out" href="/">Retour à l’accueil</a>
    </div>
  </main>

  <p class="behind" id="behind" aria-hidden="true"></p>
  <div class="black" id="black" aria-hidden="true"><p id="blackText"></p></div>
  <div id="cursor" aria-hidden="true"></div>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const touch = matchMedia('(hover: none)').matches;
    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    let leaving = false;

    // ---------- Le son : un souffle grave et un cœur qui bat (démarre au premier contact, volume bas) ----------
    const sound = (() => {
      let ac = null, master = null, bpm = 54, beatTimer = 0, on = false;
      function thump(t, strength) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(38, t + .18);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(strength, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .3);
        o.connect(g).connect(master); o.start(t); o.stop(t + .35);
      }
      function beat() {
        if (!on) return;
        const t = ac.currentTime + .05;
        thump(t, .9); thump(t + .22, .6);
        beatTimer = setTimeout(beat, 60000 / bpm);
      }
      return {
        start() {
          if (on || calm || leaving) return;
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
          ac = new AC(); ac.resume(); on = true;
          master = ac.createGain(); master.gain.value = .0001; master.connect(ac.destination);
          master.gain.exponentialRampToValueAtTime(.35, ac.currentTime + 4);
          const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 180; f.connect(master);
          [41, 43.5].forEach(hz => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = hz; g.gain.value = .05; o.connect(g).connect(f); o.start(); });
          beat();
        },
        faster(n) { bpm = Math.min(150, bpm + n); },
        stop() { on = false; clearTimeout(beatTimer); if (master) master.gain.setTargetAtTime(.0001, ac.currentTime, .1); }
      };
    })();

    // ---------- Le bouton retour : fonctionne toujours, du premier coup ----------
    // En ligne : la racine du site. En double-clic (file://) : l'index.html à côté de cette page.
    const home = location.protocol === 'file:' ? new URL('index.html', location.href).href : '/';
    const out = $('out');
    out.href = home;
    out.addEventListener('click', e => {
      if (calm || leaving || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; // navigation normale
      e.preventDefault(); leaving = true;
      sound.stop();
      $('blackText').textContent = 'On te laisse partir. Cette fois.';
      $('black').classList.add('on');
      setTimeout(() => { location.href = home; }, 1500);
    });
    out.addEventListener('pointerenter', () => { if (!leaving) out.textContent = pick(['Pars. Vite.', 'Il ne te suivra pas.', 'Retour à l’accueil']); });
    out.addEventListener('pointerleave', () => { if (!leaving) out.textContent = 'Retour à l’accueil'; });
    // Le son démarre au premier contact, sauf si ce contact est le bouton retour.
    ['pointerdown', 'keydown'].forEach(t => addEventListener(t, e => { if (!out.contains(e.target)) sound.start(); }));

    // ---------- Neige télé ----------
    const cv = $('noise'), cx = cv.getContext('2d');
    function size() { cv.width = Math.ceil(innerWidth / 3); cv.height = Math.ceil(innerHeight / 3); }
    size(); addEventListener('resize', size);
    function snow() {
      const img = cx.createImageData(cv.width, cv.height), d = img.data;
      for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
      cx.putImageData(img, 0, 0);
      if (!calm) requestAnimationFrame(snow);
    }
    snow();

    // ---------- Ce que la page « sait » ----------
    const path = decodeURIComponent(location.pathname).split('/').filter(Boolean).pop() || 'cette page';
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
    const night = now.getHours() < 6 || now.getHours() >= 22;
    let visits = 1;
    try { visits = (+localStorage.getItem('af_404') || 0) + 1; localStorage.setItem('af_404', visits); } catch (_) {}
    const script = [
      ['', `« ${path.length > 36 ? path.slice(0, 36) + '…' : path} » n’existe pas.`],
      ['', 'Elle n’a jamais existé.'],
      ['hot', '…pourtant tu es là.'],
      visits > 1 ? ['hot', `C’est ta ${visits}e visite. Pourquoi tu reviens ?`] : ['', 'Personne ne vient jamais ici.'],
      ['', night ? `Il est ${hh}:${mm}. Tu devrais dormir.` : `Il est ${hh}:${mm}. Personne ne sait que tu es ici.`],
      ['', touch ? 'Tu tiens ton téléphone près de ton visage.' : 'Tu es assis. Quelqu’un est debout.'],
      ['red', 'Ne te retourne pas.']
    ];

    // ---------- Machine à écrire (les phrases attendent leur tour) ----------
    const lines = $('lines');
    let typing = Promise.resolve();
    function type(cls, text) {
      typing = typing.then(async () => {
        const p = document.createElement('p');
        if (cls) p.className = cls;
        const caret = document.createElement('span'); caret.className = 'caret';
        p.append(caret); lines.append(p);
        while (lines.children.length > 7) lines.firstElementChild.remove();
        for (const ch of text) {
          caret.before(ch);
          if (!calm) await wait('.…?'.includes(ch) ? 300 : rand(30, 90));
        }
        if (!calm) await wait(rand(700, 1300));
        caret.remove();
      });
      return typing;
    }
    (async () => {
      if (!calm) await wait(900);
      script.forEach(([cls, text]) => type(cls, text));
      await typing;
      $('eyes').classList.add('on');
      if (!calm) { setTimeout(corrupt, 3000); setTimeout(blackout, rand(16000, 22000)); }
    })();

    // ---------- Les phrases pourrissent par moments ----------
    const Z = Array.from({ length: 0x36f - 0x300 + 1 }, (_, i) => String.fromCharCode(0x300 + i));
    const rot = s => [...s].map(c => c === ' ' || Math.random() > .35 ? c : c + pick(Z) + pick(Z) + (Math.random() > .6 ? pick(Z) : '')).join('');
    function corrupt() {
      const ps = [...lines.querySelectorAll('p')].filter(p => !p.querySelector('.caret'));
      if (ps.length) {
        const p = pick(ps);
        const clean = p.dataset.clean || (p.dataset.clean = p.textContent);
        p.textContent = rot(clean);
        setTimeout(() => { p.textContent = clean; }, rand(300, 900));
      }
      setTimeout(corrupt, rand(2200, 5000));
    }

    // ---------- La coupure : tout s'éteint… et quand ça revient, il est plus près ----------
    const after = ['Je suis derrière toi.', 'Tu as entendu ça ?', 'Je connais ton prénom.', 'Je ne suis pas dans l’écran.'];
    let cuts = 0;
    async function blackout() {
      if (leaving) return;
      cuts++;
      $('blackText').textContent = '';
      $('black').classList.add('on');
      sound.faster(18);
      await wait(cuts === 1 ? 1800 : 1100);
      if (leaving) return;
      $('black').classList.remove('on');
      document.body.classList.add('close');
      type('red', after[(cuts - 1) % after.length]);
      document.title = pick(['derrière toi', 'ne te retourne pas', 'tu es seul ?']);
      setTimeout(blackout, rand(18000, 30000));
    }

    // ---------- Glitch du 404 ----------
    const code = $('code');
    function glitch() { restart(code, 'glitch'); setTimeout(glitch, rand(1800, 5200)); }
    if (!calm) setTimeout(glitch, 1500);

    // ---------- Le visage ----------
    const ghost = $('ghost');
    ghost.addEventListener('error', () => ghost.remove());
    function apparition() { restart(ghost, 'flash'); setTimeout(apparition, rand(14000, 26000)); }
    if (!calm) setTimeout(apparition, rand(9000, 13000));

    // ---------- Les yeux suivent, clignent ; si tu ne bouges plus, ils te fixent ----------
    const pupils = document.querySelectorAll('.eye i');
    const cursor = $('cursor');
    function look(x, y) {
      pupils.forEach(p => {
        const r = p.parentElement.getBoundingClientRect();
        const a = Math.atan2(y - (r.top + r.height / 2), x - (r.left + r.width / 2));
        p.style.transform = `translate(${Math.cos(a) * 14}px, ${Math.sin(a) * 5}px)`;
      });
    }
    let still = 0;
    addEventListener('pointermove', e => {
      cursor.style.opacity = 1;
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      look(e.clientX, e.clientY);
      clearTimeout(still);
      still = setTimeout(() => pupils.forEach(p => { p.style.transform = 'translate(0, 0)'; }), 4000);
    });
    function blink() { restart($('eyes'), 'blink'); setTimeout(blink, rand(2500, 7000)); }
    if (!calm) setTimeout(blink, 4000);

    // ---------- Murmures ----------
    const whispers = ['il te regarde', touch ? 'touche l’écran' : 'clique', 'écoute', 'il est là', 'reste'];
    function murmur() { const b = $('behind'); b.textContent = pick(whispers); restart(b, 'on'); setTimeout(murmur, rand(12000, 24000)); }
    if (!calm) setTimeout(murmur, 14000);

    // ---------- L'onglet ----------
    let since = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (leaving) return;
      if (document.hidden) { document.title = 'reviens.'; since = Date.now(); }
      else {
        const s = Math.round((Date.now() - since) / 1000);
        document.title = '404';
        if (s > 2) { type('red', `Tu es parti ${s} secondes. On t’a attendu.`); sound.faster(10); }
      }
    });
  })();
  </script>
</body>
</html>
