<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jérôme — ArchiveFever.Work</title>
  <meta name="description" content="Press the suspicious button and discover what it means to get Jeromed." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#100916" />
  <link rel="canonical" href="https://archivefever.work/Jeromed.html" />
  <link rel="icon" href="IMG/Jerome.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="IMG/Jerome.webp" />

  <style>
    :root {
      color-scheme: dark;
      --ink: #fff9ee;
      --muted: #c7b9ca;
      --orange: #ff8a00;
      --yellow: #ffd447;
      --pink: #ff3d81;
      --violet: #7c3cff;
      --surface: rgba(27, 15, 33, .74);
      --stroke: rgba(255, 255, 255, .13);
      --shadow: 0 28px 90px rgba(0, 0, 0, .5);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    * {
      margin: 0;
    }

    html {
      min-width: 300px;
      min-height: 100%;
      background: #100916;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background: #0c0b0d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button, a {
      font: inherit;
    }

    button {
      -webkit-user-select: none;
      user-select: none;
    }

    [hidden] {
      display: none !important;
    }

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -2;
      top: 13%;
      right: -9%;
      width: min(52vw, 620px);
      height: min(75vh, 700px);
      background: var(--orange);
      transform: rotate(8deg);
      box-shadow: 24px 24px 0 #44156d;
    }

    .page::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .22;
      background-image: radial-gradient(rgba(255, 255, 255, .8) .75px, transparent .75px);
      background-size: 7px 7px;
      pointer-events: none;
    }

    .shell {
      width: min(100%, 940px);
    }

    .poster-kicker {
      width: fit-content;
      margin-bottom: clamp(14px, 3vh, 26px);
      padding-bottom: 4px;
      border-bottom: 3px solid var(--orange);
      color: #d8ceda;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .card {
      position: relative;
    }

    .poster-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(250px, .8fr);
      grid-template-areas:
        "title portrait"
        "action portrait";
      align-items: center;
      gap: 20px clamp(24px, 7vw, 80px);
    }

    h1 {
      grid-area: title;
      position: relative;
      z-index: 2;
      color: #fff8e9;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(4.7rem, 10vw, 8.4rem);
      font-weight: 950;
      letter-spacing: -.045em;
      line-height: .78;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    h1 em {
      display: block;
      width: fit-content;
      margin-top: .14em;
      padding: .04em .11em .08em;
      color: #100b0d;
      background: var(--yellow);
      box-shadow: 10px 10px 0 #ff3d81;
      font-style: normal;
      transform: rotate(1deg);
    }

    .intro-portrait {
      grid-area: portrait;
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      transform: rotate(3deg);
    }

    .intro-portrait::before {
      content: "";
      position: absolute;
      width: 84%;
      aspect-ratio: 1;
      background: #261331;
      box-shadow: -15px 15px 0 #ff3d81;
      transform: rotate(-7deg);
    }

    .intro-portrait img {
      position: relative;
      z-index: 1;
      width: min(100%, 390px);
      height: auto;
      object-fit: contain;
      filter: saturate(1.08) contrast(1.08) drop-shadow(14px 20px 0 rgba(0, 0, 0, .26));
      animation: suspicious 2.4s ease-in-out infinite;
    }

    .action-block {
      grid-area: action;
      width: min(100%, 440px);
      align-self: start;
    }

    .action-wrap {
      position: relative;
      width: 100%;
    }

    .go-btn {
      --mx: 0px;
      --my: 0px;
      position: relative;
      width: 100%;
      min-height: 76px;
      display: grid;
      grid-template-columns: 50px 1fr;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      padding: 10px 18px 10px 11px;
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 3px;
      color: #1a0c0a;
      background: linear-gradient(115deg, var(--yellow), var(--orange) 52%, #ff6767);
      box-shadow:
        0 13px 0 #87320a,
        0 20px 40px rgba(255, 92, 32, .26),
        inset 0 2px rgba(255, 255, 255, .62);
      cursor: pointer;
      transform: translate(var(--mx), var(--my)) rotate(-1deg);
      transition: transform .16s ease, box-shadow .16s ease, filter .2s ease;
      touch-action: manipulation;
    }

    .go-btn::after {
      content: "";
      position: absolute;
      top: -45%;
      left: -30%;
      width: 28%;
      height: 190%;
      background: rgba(255, 255, 255, .45);
      filter: blur(10px);
      transform: rotate(18deg);
      animation: buttonShine 2.8s ease-in-out infinite;
    }

    .go-btn:hover {
      filter: saturate(1.16) brightness(1.07);
      box-shadow:
        0 10px 0 #87320a,
        0 24px 54px rgba(255, 92, 32, .4),
        inset 0 2px rgba(255, 255, 255, .7);
    }

    .go-btn:active {
      transform: translate(var(--mx), calc(var(--my) + 8px)) scale(.99);
      box-shadow:
        0 4px 0 #87320a,
        0 11px 22px rgba(255, 92, 32, .28),
        inset 0 2px rgba(255, 255, 255, .7);
    }

    .go-btn:disabled {
      cursor: wait;
      filter: grayscale(.1) brightness(.85);
    }

    .go-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(70, 20, 0, .2);
      border-radius: 2px;
      color: #fff;
      background: rgba(85, 20, 2, .82);
      box-shadow: inset 0 1px rgba(255, 255, 255, .24);
      font-size: 23px;
    }

    .go-copy {
      display: block;
      text-align: left;
    }

    .go-copy strong {
      font-size: clamp(1rem, 3.8vw, 1.28rem);
      font-weight: 950;
      letter-spacing: -.02em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .progress {
      position: absolute;
      inset: auto 14px 10px;
      z-index: 4;
      height: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(70, 20, 0, .18);
      opacity: 0;
      transition: opacity .2s;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #fff8db;
      box-shadow: 0 0 12px #fff;
    }

    .is-arming .progress {
      opacity: 1;
    }

    .is-arming .progress-fill {
      animation: load 1.2s cubic-bezier(.22, .7, .25, 1) forwards;
    }

    .hint {
      min-height: 1.2em;
      margin-top: 18px;
      color: var(--yellow);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .go-btn:focus-visible,
    .reveal-button:focus-visible,
    .icon-button:focus-visible,
    .support-link:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px;
    }

    .chaos {
      position: fixed;
      inset: 0;
      z-index: 100;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding:
        max(22px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background:
        repeating-conic-gradient(from 0deg at 50% 48%, rgba(255, 225, 80, .22) 0deg 7deg, transparent 7deg 15deg),
        radial-gradient(circle at 50% 48%, #ffb000 0 8%, #ff4b1f 30%, #a70847 61%, #24031f 100%);
      animation: revealIn .24s ease-out both, screenShake .09s .24s 7 alternate;
    }

    .chaos::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, .18) 4px 5px);
      mix-blend-mode: multiply;
    }

    .top-actions {
      position: absolute;
      z-index: 140;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      gap: 9px;
    }

    .icon-button {
      min-width: 46px;
      min-height: 46px;
      display: grid;
      grid-template-columns: auto auto;
      place-items: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 999px;
      color: #fff;
      background: rgba(23, 5, 24, .72);
      box-shadow: 0 8px 25px rgba(0, 0, 0, .24);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      transition: background .18s, transform .18s;
    }

    .icon-button:hover {
      background: rgba(23, 5, 24, .92);
      transform: translateY(-2px);
    }

    .reveal-content {
      position: relative;
      z-index: 120;
      width: min(100%, 980px);
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .alert-pill {
      margin-bottom: clamp(9px, 2vh, 16px);
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, .42);
      border-radius: 999px;
      color: #45100c;
      background: var(--yellow);
      box-shadow: 0 7px 0 rgba(90, 15, 13, .45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(9px, 2vw, 12px);
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      transform: rotate(-2deg);
      animation: dropIn .48s .2s cubic-bezier(.16, 1, .3, 1) both;
    }

    .chaos-title {
      position: relative;
      z-index: 2;
      color: #fff7d0;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(3rem, 12vw, 8.7rem);
      font-weight: 950;
      letter-spacing: -.04em;
      line-height: .78;
      text-transform: uppercase;
      -webkit-text-stroke: clamp(1px, .25vw, 3px) #4a0619;
      text-shadow:
        4px 5px 0 #fe2d67,
        8px 10px 0 #6d0b45,
        0 15px 45px rgba(47, 0, 33, .45);
      transform: rotate(-2deg);
      animation: titleSlam .5s cubic-bezier(.16, 1.25, .3, 1) both;
    }

    .jerome-stage {
      position: relative;
      width: clamp(220px, 45vmin, 440px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: clamp(10px, 2vh, 20px) 0 clamp(9px, 2vh, 17px);
    }

    .jerome-main {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: saturate(1.16) contrast(1.05) drop-shadow(0 22px 22px rgba(56, 0, 35, .42));
      animation: jeromePop .58s .08s cubic-bezier(.16, 1.25, .3, 1) both, partyCat .65s .8s ease-in-out infinite alternate;
    }

    .stamp {
      position: absolute;
      z-index: 6;
      right: -10%;
      bottom: 12%;
      padding: 8px 10px;
      border: 4px solid #fff7d0;
      border-radius: 7px;
      color: #fff7d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(.72rem, 2.4vw, 1.05rem);
      font-weight: 950;
      letter-spacing: .09em;
      text-transform: uppercase;
      transform: rotate(-10deg);
      animation: stampIn .35s .62s cubic-bezier(.16, 1.45, .3, 1) both;
    }

    .reveal-subtitle {
      margin-bottom: 14px;
      color: #fff7d0;
      font-size: clamp(.78rem, 2.6vw, 1.08rem);
      font-weight: 900;
      letter-spacing: .03em;
      text-shadow: 0 2px 8px rgba(60, 0, 36, .5);
    }

    .reveal-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      animation: dropIn .45s .78s both;
    }

    .reveal-button,
    .support-link {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 17px;
      border-radius: 13px;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .04em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .18s, box-shadow .18s, background .18s;
    }

    .reveal-button {
      border: 1px solid rgba(255, 255, 255, .65);
      color: #3d0719;
      background: #fff7d0;
      box-shadow: 0 7px 0 #8c2141;
      cursor: pointer;
    }

    .support-link {
      border: 1px solid rgba(255, 255, 255, .34);
      color: #fff;
      background: rgba(41, 4, 34, .57);
      box-shadow: 0 7px 0 rgba(69, 3, 45, .62);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .reveal-button:hover,
    .support-link:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 0 10px 0 #65112f, 0 15px 30px rgba(54, 0, 37, .25);
    }

    .jerome-mini {
      position: fixed;
      z-index: 110;
      width: var(--size);
      height: var(--size);
      object-fit: contain;
      filter: drop-shadow(0 12px 12px rgba(55, 0, 34, .34));
      pointer-events: none;
      animation: miniPop .45s var(--delay) cubic-bezier(.16, 1.3, .3, 1) both, miniFloat var(--float-time) calc(var(--delay) + .45s) ease-in-out infinite alternate;
    }

    .confetti {
      position: fixed;
      z-index: 130;
      top: -8vh;
      left: var(--x);
      width: var(--w);
      height: calc(var(--w) * 1.8);
      border-radius: 2px;
      background: var(--color);
      pointer-events: none;
      animation: confettiFall var(--fall-time) var(--delay) linear infinite;
    }

    @keyframes suspicious { 50% { transform: rotate(3deg) scale(1.04); } }
    @keyframes buttonShine { 50%, 100% { left: 120%; } }
    @keyframes load { to { width: 100%; } }
    @keyframes revealIn { from { opacity: 0; transform: scale(1.08); } }
    @keyframes screenShake { from { transform: translate(-5px, 2px) rotate(-.25deg); } to { transform: translate(5px, -2px) rotate(.25deg); } }
    @keyframes titleSlam { from { opacity: 0; transform: scale(2.4) rotate(5deg); filter: blur(15px); } to { opacity: 1; transform: scale(1) rotate(-2deg); filter: blur(0); } }
    @keyframes jeromePop { from { opacity: 0; transform: scale(.1) rotate(-24deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes partyCat { to { transform: rotate(3deg) scale(1.035); } }
    @keyframes stampIn { from { opacity: 0; transform: scale(2.7) rotate(12deg); } }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-20px); } }
    @keyframes miniPop { from { opacity: 0; transform: scale(0) rotate(-35deg); } to { opacity: 1; transform: scale(1) rotate(var(--rotate)); } }
    @keyframes miniFloat { to { transform: translate(var(--drift-x), var(--drift-y)) rotate(calc(var(--rotate) * -1)) scale(1.08); } }
    @keyframes confettiFall { to { transform: translate3d(var(--wind), 116vh, 0) rotate(760deg); } }

    @media (max-width: 700px) {
      .page::before {
        top: 29%;
        right: -35%;
        width: 95vw;
        height: 45vh;
      }

      .poster-kicker {
        margin-inline: auto;
      }

      .poster-layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "title"
          "portrait"
          "action";
        justify-items: center;
        gap: clamp(15px, 3vh, 24px);
      }

      h1 {
        font-size: clamp(3.7rem, 19vw, 6rem);
        text-align: center;
      }

      h1 em {
        margin-inline: auto;
      }

      .intro-portrait {
        width: min(58vw, 260px);
      }

      .action-block {
        width: min(100%, 430px);
      }

      .go-btn {
        min-height: 68px;
        grid-template-columns: 46px 1fr;
      }

      .go-icon {
        width: 46px;
        height: 46px;
      }

      .icon-button .button-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .stamp {
        right: -4%;
      }
    }

    @media (max-height: 720px) {
      .poster-kicker {
        margin-bottom: 10px;
      }

      .poster-layout {
        gap: 12px 45px;
      }

      .intro-portrait {
        max-height: 34vh;
      }

      .intro-portrait img {
        max-height: 34vh;
      }

      .jerome-stage {
        width: clamp(180px, 42vmin, 330px);
        margin-block: 7px;
      }

      .chaos-title {
        font-size: clamp(2.6rem, 10vw, 6.5rem);
      }
    }

    @media (pointer: coarse) {
      .go-btn:hover,
      .reveal-button:hover,
      .support-link:hover,
      .icon-button:hover {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .card,
      .go-btn {
        transform: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="mainPage">
    <div class="shell">
      <p class="poster-kicker">ArchiveFever.Work</p>
      <section class="card" id="card" aria-labelledby="pageTitle">
        <div class="poster-layout">
          <h1 id="pageTitle">Do not <em>press.</em></h1>

          <div class="intro-portrait" aria-hidden="true">
            <img src="IMG/Jerome.webp" alt="" />
          </div>

          <div class="action-block">
            <div class="action-wrap" id="actionWrap">
              <button class="go-btn" id="goBtn" type="button" aria-describedby="buttonHint">
                <span class="go-icon" aria-hidden="true">⚡</span>
                <span class="go-copy"><strong id="buttonText">Press anyway</strong></span>
                <span class="progress" aria-hidden="true"><span class="progress-fill"></span></span>
              </button>
            </div>
            <p class="hint" id="buttonHint" role="status" aria-live="polite"></p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <section class="chaos" id="chaos" role="dialog" aria-modal="true" aria-labelledby="chaosTitle" hidden>
    <div class="top-actions">
      <button class="icon-button" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute sound">
        <span id="soundIcon" aria-hidden="true">🔊</span><span class="button-label">Sound</span>
      </button>
      <button class="icon-button" id="closeBtn" type="button" aria-label="Close Jerome reveal">
        <span aria-hidden="true">✕</span><span class="button-label">Close</span>
      </button>
    </div>

    <div class="reveal-content">
      <div class="alert-pill">I SAID DON'T CLICK BOZO ⚠</div>
      <h2 class="chaos-title" id="chaosTitle">Get Jeromed!</h2>

      <div class="jerome-stage">
        <img src="IMG/Jerome.webp" class="jerome-main" alt="Jerome, the ArchiveFever.Work cat mascot" />
        <span class="stamp">100% Jeromed</span>
      </div>

      <p class="reveal-subtitle">Congratulations. You cursed now.</p>
      <div class="reveal-actions">
        <button class="reveal-button" id="againBtn" type="button">↻ Jerome me again</button>
        <a class="support-link" href="Donations/index.html">♡ Support the madness</a>
      </div>
    </div>
  </section>

  <audio id="screamerAudio" src="SOUND/o-o.mp3" preload="auto" loop></audio>

  <script>
    (() => {
      "use strict";

      const mainPage = document.getElementById("mainPage");
      const card = document.getElementById("card");
      const actionWrap = document.getElementById("actionWrap");
      const goBtn = document.getElementById("goBtn");
      const buttonText = document.getElementById("buttonText");
      const buttonHint = document.getElementById("buttonHint");
      const chaos = document.getElementById("chaos");
      const againBtn = document.getElementById("againBtn");
      const closeBtn = document.getElementById("closeBtn");
      const soundBtn = document.getElementById("soundBtn");
      const soundIcon = document.getElementById("soundIcon");
      const audio = document.getElementById("screamerAudio");
      audio.loop = true;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const finePointer = window.matchMedia("(pointer: fine)");

      let soundOff = false;
      let arming = false;
      let timers = [];

      const later = (callback, delay) => {
        const timer = window.setTimeout(callback, delay);
        timers.push(timer);
        return timer;
      };

      const clearTimers = () => {
        timers.forEach(window.clearTimeout);
        timers = [];
      };

      const primeAudio = () => {
        audio.muted = true;
        audio.currentTime = 0;
        const promise = audio.play();
        if (promise) promise.catch(() => {});
      };

      const playScreamer = () => {
        audio.currentTime = 0;
        audio.muted = soundOff;
        audio.volume = 1;
        const promise = audio.play();
        if (promise) promise.catch(() => {});
      };

      const removePartyBits = () => {
        chaos.querySelectorAll(".jerome-mini, .confetti").forEach((node) => node.remove());
      };

      const makePartyBits = () => {
        removePartyBits();

        const miniCount = window.innerWidth < 560 ? 8 : 13;
        const confettiCount = reduceMotion.matches ? 0 : (window.innerWidth < 560 ? 30 : 52);

        for (let i = 0; i < miniCount; i += 1) {
          const mini = document.createElement("img");
          const edge = i % 2 === 0;
          const size = Math.round(48 + Math.random() * (window.innerWidth < 560 ? 34 : 58));
          mini.src = "IMG/Jerome.webp";
          mini.alt = "";
          mini.className = "jerome-mini";
          mini.style.left = edge ? `${Math.random() * 20 - 3}%` : `${80 + Math.random() * 20}%`;
          mini.style.top = `${5 + Math.random() * 88}%`;
          mini.style.setProperty("--size", `${size}px`);
          mini.style.setProperty("--delay", `${(Math.random() * .65).toFixed(2)}s`);
          mini.style.setProperty("--rotate", `${Math.round(Math.random() * 32 - 16)}deg`);
          mini.style.setProperty("--drift-x", `${Math.round(Math.random() * 30 - 15)}px`);
          mini.style.setProperty("--drift-y", `${Math.round(Math.random() * 36 - 18)}px`);
          mini.style.setProperty("--float-time", `${(2.2 + Math.random() * 2).toFixed(2)}s`);
          chaos.appendChild(mini);
        }

        const colors = ["#fff7d0", "#ffd447", "#ff3d81", "#6ef1ff", "#7c3cff"];
        for (let i = 0; i < confettiCount; i += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.style.setProperty("--x", `${Math.random() * 100}%`);
          piece.style.setProperty("--w", `${5 + Math.random() * 7}px`);
          piece.style.setProperty("--color", colors[i % colors.length]);
          piece.style.setProperty("--delay", `${(-Math.random() * 2.8).toFixed(2)}s`);
          piece.style.setProperty("--fall-time", `${(2.4 + Math.random() * 2.5).toFixed(2)}s`);
          piece.style.setProperty("--wind", `${Math.round(Math.random() * 180 - 90)}px`);
          chaos.appendChild(piece);
        }
      };

      const revealJerome = () => {
        arming = false;
        actionWrap.classList.remove("is-arming");
        chaos.hidden = false;
        mainPage.setAttribute("aria-hidden", "true");
        mainPage.inert = true;
        document.body.style.overflow = "hidden";
        makePartyBits();
        playScreamer();
        later(() => againBtn.focus({ preventScroll: true }), 850);
      };

      const startSequence = () => {
        if (arming || !chaos.hidden) return;
        arming = true;
        clearTimers();
        primeAudio();
        goBtn.disabled = true;
        actionWrap.classList.add("is-arming");
        buttonText.textContent = "Wait…";
        buttonHint.textContent = "Too late.";

        later(() => { buttonText.textContent = "No, really…"; }, 390);
        later(() => { buttonText.textContent = "Jerome!"; }, 790);
        later(revealJerome, reduceMotion.matches ? 250 : 1220);
      };

      const resetIntro = () => {
        arming = false;
        clearTimers();
        audio.pause();
        audio.currentTime = 0;
        chaos.hidden = true;
        mainPage.removeAttribute("aria-hidden");
        mainPage.inert = false;
        document.body.style.overflow = "";
        actionWrap.classList.remove("is-arming");
        goBtn.disabled = false;
        buttonText.textContent = "Press anyway";
        buttonHint.textContent = "";
        removePartyBits();
        goBtn.focus({ preventScroll: true });
      };

      const replay = () => {
        clearTimers();
        chaos.hidden = true;
        removePartyBits();
        audio.pause();
        requestAnimationFrame(() => {
          chaos.hidden = false;
          makePartyBits();
          playScreamer();
          later(() => againBtn.focus({ preventScroll: true }), 700);
        });
      };

      const toggleSound = () => {
        soundOff = !soundOff;
        audio.muted = soundOff;
        soundBtn.setAttribute("aria-pressed", String(soundOff));
        soundBtn.setAttribute("aria-label", soundOff ? "Turn sound on" : "Mute sound");
        soundIcon.textContent = soundOff ? "🔇" : "🔊";
      };

      goBtn.addEventListener("click", startSequence);
      againBtn.addEventListener("click", replay);
      closeBtn.addEventListener("click", resetIntro);
      soundBtn.addEventListener("click", toggleSound);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !chaos.hidden) resetIntro();
      });

      card.addEventListener("pointermove", (event) => {
        if (!finePointer.matches || reduceMotion.matches) return;
        const rect = card.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - .5;
        const y = (event.clientY - rect.top) / rect.height - .5;
        card.style.setProperty("--rx", `${(-y * 3.5).toFixed(2)}deg`);
        card.style.setProperty("--ry", `${(x * 4).toFixed(2)}deg`);
      });

      card.addEventListener("pointerleave", () => {
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
      });

      goBtn.addEventListener("pointermove", (event) => {
        if (!finePointer.matches || reduceMotion.matches || goBtn.disabled) return;
        const rect = goBtn.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width - .5) * 7;
        const y = ((event.clientY - rect.top) / rect.height - .5) * 5;
        goBtn.style.setProperty("--mx", `${x.toFixed(1)}px`);
        goBtn.style.setProperty("--my", `${y.toFixed(1)}px`);
      });

      goBtn.addEventListener("pointerleave", () => {
        goBtn.style.setProperty("--mx", "0px");
        goBtn.style.setProperty("--my", "0px");
      });
    })();
  </script>
</body>
</html>
