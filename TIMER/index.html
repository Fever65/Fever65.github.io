<!DOCTYPE html>
<html lang="fr" data-wada="z4">
<head>
  <meta charset="UTF-8" />
  <!-- Transition entre pages interrompue (navigation rapide, retour) : la page change sans animation, ce n'est pas une erreur.
       En ligne et avant tout le reste : pagereveal part avant le premier rendu, donc avant les scripts defer. -->
  <script>addEventListener("pagereveal", e => { const v = e.viewTransition; if (v) [v.ready, v.finished, v.updateCallbackDone].forEach(p => p && p.catch(() => {})); });</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Minuteur en ligne — ArchiveFever.Work</title>
  <meta name="description" content="Un minuteur gratuit et sans compte avec raccourcis, progression visuelle et alerte sonore locale." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#501345" />
  <link rel="canonical" href="https://archivefever.work/TIMER/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="ArchiveFever.Work" />
  <meta property="og:title" content="Minuteur en ligne — ArchiveFever.Work" />
  <meta property="og:description" content="Lance un compte à rebours avec raccourcis et alerte sonore, directement dans le navigateur." />
  <meta property="og:url" content="https://archivefever.work/TIMER/" />
  <meta property="og:image" content="https://archivefever.work/IMG/Jerome.webp" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="../IMG/Jerome.webp" type="image/webp" />
  <link rel="apple-touch-icon" href="/IMG/Jerome.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;family=Geist:wght@400;500&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/tokens.css" />
  <link rel="stylesheet" href="../assets/site.css" />
  <link rel="stylesheet" href="timer.css" />
  <script src="../assets/site.js" defer></script>
  <script src="timer.js" defer></script>
</head>
<body class="station">

<header class="z-head">
  <div class="z-left">
    <a class="z-home" href="../index.html#z4" data-i18n-attr="aria-label:backAria" aria-label="Retour à l'accueil"><span class="z-dot" aria-hidden="true"></span><span class="z-home-txt" aria-hidden="true">ArchiveFever.Work</span></a>
    <span class="z-crumb"><span data-i18n="timer">Minuteur</span></span>
  </div>
  <div class="z-right">
    <span class="wada"><i></i><i></i><i></i></span>
    <div class="lang" role="group" aria-label="Choisir la langue"><button type="button" data-set-lang="fr" aria-pressed="true" lang="fr">FR</button><button type="button" data-set-lang="en" aria-pressed="false" lang="en">EN</button></div>
  </div>
</header>

<main class="hall">
  <section class="clock" aria-labelledby="timerTitle">
    <!-- Le panneau : les chiffres géants, les réglages juste dessous, les commandes -->
    <div class="board">
      <div class="board-head">
        <h1 class="platform" id="timerTitle"><span data-i18n="timer">Minuteur</span></h1>
        <p class="state" id="stateLabel" role="status">Prêt</p>
      </div>
      <div class="display" id="display" aria-live="polite">25:00</div>
      <p class="ends" id="endsAt" aria-live="off">&nbsp;</p>
      <div class="sr-only" id="progressBar" role="progressbar" data-i18n-attr="aria-label:progress" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

      <!-- Le tableau des départs : la durée et les raccourcis, toujours visibles -->
      <div class="departures" role="group" aria-labelledby="settingsTitle">
        <h2 class="sr-only" id="settingsTitle" data-i18n="settings">Réglages</h2>
        <div class="dep-row">
          <span class="dep-label" id="durationLabel" data-i18n="duration">Durée</span>
          <div class="duration" role="group" aria-labelledby="durationLabel">
            <label><input class="time-input" id="hours" type="number" min="0" max="23" step="1" value="0" inputmode="numeric" /><span data-i18n="hours">Heures</span></label>
            <label><input class="time-input" id="minutes" type="number" min="0" max="59" step="1" value="25" inputmode="numeric" /><span data-i18n="minutes">Minutes</span></label>
            <label><input class="time-input" id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" /><span data-i18n="seconds">Secondes</span></label>
          </div>
        </div>
        <div class="dep-row">
          <span class="dep-label" id="presetsLabel" data-i18n="presets">Raccourcis</span>
          <div class="presets" role="group" aria-labelledby="presetsLabel">
            <button class="preset" type="button" data-min="1">1 min</button>
            <button class="preset" type="button" data-min="5">5 min</button>
            <button class="preset" type="button" data-min="10">10 min</button>
            <button class="preset" type="button" data-min="15">15 min</button>
            <button class="preset" type="button" data-min="25">25 min</button>
            <button class="preset" type="button" data-min="60">1 h</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="go" type="button" id="startBtn">Démarrer</button>
        <button class="halt" type="button" id="pauseBtn" data-i18n="pause">Pause</button>
        <button class="halt" type="button" id="resetBtn" data-i18n="reset">Réinitialiser</button>
      </div>
      <div class="extras">
        <button class="focus-btn" type="button" id="focusBtn" aria-pressed="false"><span class="focus-ico" aria-hidden="true"></span><span data-i18n="focus">Mode focus</span></button>
        <span class="sound-row"><span class="sound-dot" id="soundDot" aria-hidden="true"></span><button class="link-btn" type="button" id="testSoundBtn" data-i18n="test">Tester le son</button></span>
        <p class="kbd-hint" data-i18n-html="keys"><kbd>Espace</kbd> démarrer / pause · <kbd>R</kbd> réinitialiser · <kbd>F</kbd> focus</p>
      </div>
      <p class="hint" data-i18n="soundHint">Le son reste sur ton appareil. Autorise-le en démarrant ou en testant une première fois.</p>
    </div>

    <!-- Le cadran : un cadran de minuteur sur 60 minutes. Le secteur coloré est le temps restant,
         l'aiguille des minutes en marque le bord, la trotteuse compte les secondes à rebours. -->
    <div class="ring-wrap">
      <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="face" cx="100" cy="100" r="97" />
        <circle class="sector" id="sector" cx="100" cy="100" r="38.5" pathLength="100" />
        <circle class="ring-track" cx="100" cy="100" r="91" />
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="91" pathLength="100" />
        <circle class="ticks-min" cx="100" cy="100" r="80.5" pathLength="60" />
        <circle class="ticks-hour" cx="100" cy="100" r="77" pathLength="12" />
        <g class="dial-nums">
          <text x="100" y="66">0</text><text x="138" y="104">15</text><text x="100" y="142">30</text><text x="62" y="104">45</text>
        </g>
        <text class="dial-hours" id="dialHours" x="100" y="84"></text>
        <line class="hand hand-m" id="mHand" x1="100" y1="118" x2="100" y2="24" />
        <g class="hand-s" id="sHand"><line x1="100" y1="132" x2="100" y2="41" /><circle cx="100" cy="41" r="7.6" /></g>
        <circle class="hub" cx="100" cy="100" r="2.36" />
        <circle class="ring-dot" id="ringDot" cx="100" cy="9" r="3.82" />
      </svg>
    </div>
  </section>
</main>

<footer class="z-foot">
  <span data-i18n="made">Fait main · Sans compte · Sans pub</span>
  <nav data-i18n-attr="aria-label:footNav" aria-label="Pied de page"><a href="../ABOUT/index.html" data-i18n="about">À propos</a><a href="../Donations/index.html" data-i18n="donate">Dons</a><span>© <span data-af-year>2026</span> ArchiveFever.Work</span></nav>
</footer>

<audio id="endSound" src="../SOUND/TE.mp3" preload="auto" playsinline></audio>
</body>
</html>
